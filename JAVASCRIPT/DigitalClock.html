<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #141e30, #243b55);
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        text-align: center;
        color: white;
    }

    .container h1 {
        margin-bottom: 20px;
        font-size: 40px;
    }

    #clock {
        font-size: 60px;
        background: black;
        color: #00ff88;
        padding: 25px 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px #00ff88;
        letter-spacing: 3px;
    }
</style>

<body>

    <div class="container">
        <h1>Digital Clock</h1>
        <div id="clock">
            00:00:00
        </div>
    </div>

    <script>

        let now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        setInterval(() => {
            if (hours < 10) {
                hours = "0" + hours;
            }

            if (minutes < 10) {
                minutes = "0" + minutes;
            }

            if (seconds < 10) {
                seconds = "0" + seconds;
            }


            let time = hours + ":" + minutes + ":" + seconds;

            document.getElementById("clock").innerHTML = time;

        }, 1000)



        // let div = document.querySelector("div");
        // setInterval(() => {
        //     let time = new Date();
        //     div.textContent = time.toLocaleString();



        // })







    </script>

</body>

</html>
